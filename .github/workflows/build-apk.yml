name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q Under7SignalMonitor_v2_ANDROID_GitHubActions.zip -d proyecto

      - name: Compilar APK
        working-directory: proyecto/Under7SignalMonitor
        run: |
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Under7SignalMonitor-APK
          path: proyecto/Under7SignalMonitor/app/build/outputs/apk/debug/app-debug.apk
